ont-family="Arial" font-size="31.25" lengthAdjust="spacing" textLength="453.4302" x="25" y="992.0176">Entregue e cancelada s&#227;o finais:</text><text fill="#000000" font-family="Arial" font-size="31.25" lengthAdjust="spacing" textLength="420.3644" x="25" y="1027.9521">n&#227;o podem mais ser alteradas</text></g><g class="link" data-entity-1=".start." data-entity-2="Aguardando" data-uid="lnk3" id="link_.start._Aguardando"><polygon fill="#333333" points="903.125,306.1726,911.4583,287.4226,903.125,295.756,894.7917,287.4226,903.125,306.1726" style="stroke:#333333;stroke-width:2.0833;"/><path d="M903.125,152.5593 C903.125,189.2398 903.125,248.6018 903.125,293.6726" fill="none" style="stroke:#333333;stroke-width:2.0833;"/><text fill="#000000" font-family="Arial" font-size="31.25" lengthAdjust="spacing" textLength="337.0514" x="1053.2191" y="223.2676">operador gera a entrega</text><text fill="#000000" font-family="Arial" font-size="31.25" lengthAdjust="spacing" textLength="628.9063" x="907.2917" y="259.2021">(ou o cliente final envia o pedido do cat&#225;logo)</text></g><g class="link" data-entity-1="Aguardando" data-entity-2="ACaminho" data-uid="lnk4" id="link_Aguardando_ACaminho"><polygon fill="#333333" points="338.0832,549.0437,357.8462,543.5271,346.1142,542.4096,347.2317,530.6776,338.0832,549.0437" style="stroke:#333333;stroke-width:2.0833;"/><path d="M806.7098,369.3843 C701.7326,392.7203 530.9233,437.9757 396.875,508.5388 C376.1328,519.4575 365.033,526.7814 347.7204,541.0828" fill="none" style="stroke:#333333;stroke-width:2.0833;"/><text fill="#000000" font-family="Arial" font-size="31.25" lengthAdjust="spacing" textLength="243.2251" x="590.625" y="460.7676">saiu para entrega</text></g><g class="link" data-entity-1="ACaminho" data-entity-2="Entregue" data-uid="lnk6" id="link_ACaminho_Entregue"><polygon fill="#333333" points="294.7917,791.3987,303.125,772.6487,294.7917,780.982,286.4583,772.6487,294.7917,791.3987" style="stroke:#333333;stroke-width:2.0833;"/><path d="